<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>这是oj平台</title>
    <style>
        body{
            background-color: rgb(30, 30, 30);
        }
        * {
            /*几乎所有网页开发都有这个步骤*/
            margin: 0px; /*消除默认外边距*/
            padding: 0px; /*消除默认内边距*/
            font-family:monospace;
        }
        html, body{
            width:100%;
            height:100%;
        }
        .container .content{
            width: 500px;
            margin: 150px auto;
            text-align: center;
            border-radius: 5px;
            background-color:rgb(40, 40, 40);
            height:300px;
            display:flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .container .content .font{
            display: block;
            margin-top: 20px;
            text-decoration: none;
            font-size:x-large;
        }
        .container .content .title{
            font-size:xx-large;
        }
        .container .nav{
            width: 100%;
            height: 50px;
            background-color:rgb(51, 51, 51);
            border-bottom:2px;
            border-color:rgb(71, 71, 71);
            display:flex;
            align-items: center;
        }
        .container .nav a{
            color:rgb(131, 131, 131);
            font-size:larger;
            text-decoration: none;
            line-height:50px;
            margin-left:10px;
        }
        .container .nav a:hover{
            color:aliceblue;
        }
        .container .nav img{
            margin-left:10px;
            width:25px;
            height:25px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!--nav bar-->
        <div class="nav">
            <img src="./img/leetcode.png">
            <a href="/all_questions">题库</a>
            <a href="#">竞赛</a>
            <a href="#">讨论</a>
            <a href="#">求职</a>
            <a href="#" class="shop" style="color:orange">商店</a>
        </div>
        <!--content-->
        <div class="content">
            <h2 style="color:whitesmoke" class="title">欢迎来到我的Online Judge<br></h2>
            <a href="/all_questions" style="color:white" class="font">点此跳转至题目展示页面<br></a>
            <a href="/question/1" style="color:white" class="font">点击此跳转至题目一<br></a>
            <a href="/question/2" style="color:white" class="font">点击此跳转至题目二<br></a>
        </div>
    </div>
</body>
</html>
