<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>online judge, problem list</title>
</head>
<body style="background-color: gray;">
    <table border="5px" cellspacing="10px">
        <tr>
            <th>number</th>
            <th>title</th>
            <th>difficulty</th>

        {{#question_list}} 
        <tr>
            <td>{{number}}</td>
            <td>{{title}}</td>
            <td>{{star}}</td>
        </tr>
        {{/question_list}}
    </table>
</body>
</html>
