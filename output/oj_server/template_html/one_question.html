<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{number}}.{{title}}</title>
    <!-- 引入ACE插件 -->
    <!-- 官网链接：https://ace.c9.io/ -->
    <!-- CDN链接：https://cdnjs.com/libraries/ace -->
    <!-- 使用介绍：https://www.iteye.com/blog/ybc77107-2296261 -->
    <!-- https://justcode.ikeepstudying.com/2016/05/ace-editor-%E5%9C%A8%E7%BA%BF%E4%BB%A3%E7%A0%81%E7%BC%96%E8%BE%91%E6%9E%81%E5%85%B6%E9%AB%98%E4%BA%AE/ -->
    <!-- 引入ACE CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.2.6/ace.js" type="text/javascript"
        charset="utf-8"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.2.6/ext-language_tools.js" type="text/javascript"
        charset="utf-8"></script>
    <!-- 引入jquery CDN -->
    <script src="http://code.jquery.com/jquery-2.1.1.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body{
            background-color:rgb(30, 30, 30);
            color:white;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            font-family: monospace;
        }

        .container .nav{
            width: 100%;
            height: 50px;
            background-color:rgb(51, 51, 51);
            border-bottom:2px;
            border-color:rgb(71, 71, 71);
            display:flex;
            align-items: center;
        }
        .container .nav .head{
            color:rgb(131, 131, 131);
            font-size:larger;
            text-decoration: none;
            line-height:50px;
            margin-left:10px;
        }
        .container .nav .head:hover{
            color:aliceblue;
        }
        .container .nav .img img{
            margin-left:10px;
            width:25px;
            height:25px;
        }
        .container .part1 {
            width: 100%;
            height: 600px;
            overflow: hidden;
        }

        .container .part1 .left_desc {
            width: 50%;
            height: 600px;
            float: left;
            overflow: scroll;
        }

        .container .part1 .left_desc h1 {
            padding-top: 10px;
            padding-left: 10px;
        }

        .container .part1 .left_desc pre {
            padding-top: 10px;
            padding-left: 10px;
            font-size: x-large;
            font-family: monospace;
        }

        .container .part1 .right_code {
            width: 50%;
            float: right;
        }

        .container .part1 .right_code .ace_editor {
            height: 600px;
        }
        .container .part2 {
            width: 100%;
            overflow: hidden;
        }

        .container .part2 .result {
            width: 300px;
            float: left;
            font-size: x-large;
        }

        .container .part2 .btn-submit {
            width: 120px;
            height: 50px;
            font-size: x-large;
            float: right;
            background-color: #26bb9c;
            color: #FFF;
            border: 0px;
            margin-top: 10px;
            margin-right: 10px;
        }
        .container .part2 button:hover {
            color:green;
        }

        .container .part2 .result {
            margin-top: 15px;
            margin-left: 15px;
            font-size: xx_large;
        }

        .container .part2 .result pre {
            font-size: xx_large;
        }
        .container .part2 .result p{
            font-size: xx_large;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="nav">
            <a href="/" class="img"><img src="/img/leetcode.png"></a>
            <a href="/all_questions" class="head">题库</a>
            <a href="#" class="head">竞赛</a>
            <a href="#" class="head">讨论</a>
            <a href="#" class="head">求职</a>
            <a href="#" class="head" style="color:orange">商店</a>
        </div>
        <!-- 左右呈现，题目描述和预设代码 -->
        <div class="part1">
            <div class="left_desc">
                <h1><span id="number">{{number}}</span>.{{title}}_{{star}}</h1>
                <pre>{{desc}}</pre>
            </div>
            <div class="right_code">
                <pre id="code" class="ace_editor"><textarea class="ace_text-input">{{header}}</textarea></pre>
            </div>
        </div>
        <div class="part2">
            <div class="result"></div>
            <button class="btn-submit" onclick="submit()">提交代码</button>
        </div>
    </div>
    <script>
        editor = ace.edit("code");

        editor.setTheme("ace/theme/monokai");
        editor.session.setMode("ace/mode/c_cpp");

        editor.setFontSize(22);
        editor.getSession().setTabSize(4);

        editor.setReadOnly(false);

        ace.require("ace/ext/language_tools");
        editor.setOptions({
            enableBasicAutocompletion: true,
            enableSnippets: true,
            enableLiveAutocompletion: true
        });
        //submit the content
        function submit(){
            //alert("[调试]，已提交代码!");
            var code = editor.getSession().getValue();
            var number = $(".container .part1 .left_desc h1 #number").text();
            var judge_url = "/judge/" + number;
            $.ajax({
                method: 'Post',   
                url: judge_url,  
                dataType: 'json', 
                contentType: 'application/json;charset=utf-8', 
                data: JSON.stringify({
                    'code':code,
                    'input': ''
                }),
                success: function(data){
                    show_result(data);
                }
            });
            function show_result(data)
            {
                var result_div = $(".container .part2 .result");
                result_div.empty();
                var _status = data.status;
                var _reason = data.reason;

                var reason_lable = $( "<p>",{
                       text: _reason
                });
                reason_lable.appendTo(result_div);

                if(status == 0){
                    var _stdout = data.stdout;
                    var _stderr = data.stderr;

                    var stdout_lable = $("<pre>", {
                        text: _stdout
                    });

                    var stderr_lable = $("<pre>", {
                        text: _stderr
                    })

                    stdout_lable.appendTo(result_div);
                    stderr_lable.appendTo(result_div);
                }
                else{
                    // 编译运行出错,do nothing
                }
            }
        }
    </script>
</body>

</html>
