<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线oj，题目列表</title>
    <style>
        body{
            background-color: rgb(30, 30, 30);
        }
        * {
            /*几乎所有网页开发都有这个步骤*/
            margin: 0px; /*消除默认外边距*/
            padding: 0px; /*消除默认内边距*/
            font-family:monospace;
        }
        html, body{
            width:100%;
            height:100%;
        }
        .container .nav{
            width: 100%;
            height: 50px;
            background-color:rgb(51, 51, 51);
            border-bottom:2px;
            border-color:rgb(71, 71, 71);
            display:flex;
            align-items: center;
        }
        .container .nav .head{
            color:rgb(131, 131, 131);
            font-size:larger;
            text-decoration: none;
            line-height:50px;
            margin-left:10px;
        }
        .container .nav .head:hover{
            color:aliceblue;
        }
        .container .nav .img img{
            margin-left:10px;
            width:25px;
            height:25px;
        }
        .container .question_list{
            padding-top:50px;
            width:800px;
            height:600px;
            margin:0 auto;
            background-color:rgb(40, 40, 40);
            text-align:center;
            display:flex;
            align-items:center;
            flex-direction: column;
        }
        .container .question_list table{
            text-align:center;
            width:100%;
            font-size: large;
            font-family: monospace;
        }
        .container .question_list h1{
            margin-bottom: 50px;
        }
        .container .question_list table a{
            width: 100px;
            height:30px;
            padding: 5px auto;
            text-decoration: none;
            color: whitesmoke;
            font-size:large;
            font-family: monospace;
        }
        .container .question_list table a:hover{
            color:blue;
        }
    </style>
</head>
<body>
    <div class="container">
        <!--nav bar-->
        <div class="nav">
            <a href="/" class="img"><img src="/img/leetcode.png"></a>
            <a href="/all_questions" class="head">题库</a>
            <a href="#" class="head">竞赛</a>
            <a href="#" class="head">讨论</a>
            <a href="#" class="head">求职</a>
            <a href="#" class="head" style="color:orange">商店</a>
        </div>
        <div class="question_list">
            <h1 style="color:white">Online Judge 题目列表</h1>
            <table style="color:whitesmoke">
                <tr>
                    <th style="font-size:larger">题号</th>
                    <th style="font-size:larger">题目</th>
                    <th style="font-size:larger">难度</th>
                </tr>
                {{#question_list}} 
                <tr>
                    <td class="item">{{number}}</td>
                    <td class="item"><a href="/question/{{number}}" class="title">{{title}}</a></td>
                    <td class="item">{{star}}</td>
                </tr>
                {{/question_list}}
            </table>
        </div>
    </div>
</body>
</html>
