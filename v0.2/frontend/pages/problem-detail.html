<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problem - OJ</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="../index.html" class="navbar-brand">
                <span class="brand-accent">&lt;</span>OJ<span class="brand-accent">/&gt;</span>
            </a>
            <div class="navbar-links">
                <a href="problems.html">Problems</a>
                <a href="submissions.html">Submissions</a>
                <a href="admin.html">Admin</a>
                <span class="navbar-user">
                    <span id="username-display"></span>
                    <a href="#" onclick="logout()" style="font-size:13px;">Logout</a>
                </span>
            </div>
        </div>
    </nav>

    <div class="problem-detail-page" id="app">
        <div class="problem-desc-panel" id="desc-panel">
            <div class="problem-desc-header">
                <h1 id="problem-title">Loading...</h1>
                <div class="problem-meta" id="problem-meta">
                    <span class="badge" id="difficulty-badge"></span>
                    <span class="divider"></span>
                    <span id="time-limit"></span>
                    <span class="divider"></span>
                    <span id="memory-limit"></span>
                </div>
            </div>
            <div class="problem-description" id="problem-description">
                Loading problem description...
            </div>
        </div>

        <div class="problem-editor-panel">
            <div class="editor-toolbar">
                <div class="editor-toolbar-left">
                    <label for="language">Language:</label>
                    <select id="language">
                        <option value="cpp">C++</option>
                    </select>
                </div>
            </div>
            <div class="editor-container">
                <div id="editor"></div>
            </div>
            <div class="editor-actions">
                <div>
                    <span id="submit-message"></span>
                </div>
                <button class="btn btn-success" onclick="submitCode()" id="submit-btn">
                    Submit
                </button>
            </div>
        </div>
    </div>

    <script src="../lib/ace/ace.js"></script>
    <script src="../lib/ace/mode-c_cpp.js"></script>
    <script src="../lib/ace/theme-monokai.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/editor.js"></script>
</body>
</html>
