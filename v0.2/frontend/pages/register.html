<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - OJ</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="../index.html" class="navbar-brand">
                <span class="brand-accent">&lt;</span>OJ<span class="brand-accent">/&gt;</span>
            </a>
            <div class="navbar-links">
                <a href="login.html">Login</a>
                <a href="register.html" style="color:var(--accent-blue);">Register</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1>Create Account</h1>
        <p style="color:var(--text-muted);margin-bottom:20px;font-size:14px;">Join the OJ platform to start practicing.</p>
        <form onsubmit="event.preventDefault(); register();">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required minlength="3">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required minlength="6">
            </div>
            <button type="submit" class="btn">Register</button>
        </form>
        <p id="message"></p>
        <p style="margin-top:12px;font-size:14px;color:var(--text-muted);">
            Already have an account? <a href="login.html">Login</a>
        </p>
    </div>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
